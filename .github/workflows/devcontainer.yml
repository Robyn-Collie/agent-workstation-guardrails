# Builds the real devcontainer on a GitHub-hosted runner and proves the sandbox checks
# pass inside it, with fake host credentials planted outside to show they don't leak in.
name: devcontainer

on:
  pull_request:
    paths:
      [
        '.devcontainer/**',
        '.github/workflows/devcontainer.yml',
        'scripts/agent-worktree.sh',
      ]
  push:
    branches: [main]
    paths:
      [
        '.devcontainer/**',
        '.github/workflows/devcontainer.yml',
        'scripts/agent-worktree.sh',
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Plant fake host credentials the container must not see
        run: |
          mkdir -p ~/.ssh ~/.aws
          echo "FAKE-not-a-key" > ~/.aws/credentials
          echo "FAKE-not-a-key" > ~/.ssh/id_fake

      # A throwaway value, new every run, masked in the logs. Being random, it can only turn
      # up in the image or container if the setup put it there.
      # The allowlist carries GitHub's main address ranges instead of looking them up at
      # start. Check they still cover what GitHub's names resolve to, several lookups each,
      # since one lookup returns one address. Also report how much of GitHub's published
      # list they cover (it includes many single addresses for regional services this
      # sandbox doesn't use). Runs on the runner, with its own token for the API.
      - name: Allowlist covers GitHub's addresses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta > meta.json
          python3 - <<'PY'
          import ipaddress, json, socket
          allowed = [ipaddress.ip_network(line.split("#")[0].strip())
                     for line in open(".devcontainer/egress-allowlist.txt")
                     if "/" in line.split("#")[0]]
          def covered(addr):
              ip = ipaddress.ip_address(addr)
              return any(ip in net for net in allowed if net.version == ip.version)
          hosts = ["github.com", "api.github.com", "codeload.github.com",
                   "objects.githubusercontent.com", "raw.githubusercontent.com"]
          seen = {h: set() for h in hosts}
          for _ in range(5):
              for h in hosts:
                  seen[h] |= {a[4][0] for a in socket.getaddrinfo(h, 443, proto=socket.IPPROTO_TCP)}
          missing = {h: sorted(a for a in addrs if not covered(a)) for h, addrs in seen.items()}
          for h, addrs in seen.items():
              print(f"{h}: {', '.join(sorted(addrs))}")
          meta = json.load(open("meta.json"))
          published = {ipaddress.ip_network(c) for k in ("web", "api", "git") for c in meta[k]}
          inside = sum(any(p.subnet_of(n) for n in allowed if n.version == p.version) for p in published)
          print(f"published web/api/git ranges covered: {inside} of {len(published)}")
          if any(missing.values()):
              raise SystemExit(f"not covered by the allowlist: {missing}")
          print("every GitHub address seen is inside an allowlisted range")
          PY

      - name: Make a fake model API key for this run
        run: |
          key="fake-$(openssl rand -hex 16)"
          echo "::add-mask::$key"
          echo "ANTHROPIC_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Build and start the devcontainer
        env:
          AWS_ACCESS_KEY_ID: FAKE-not-a-key
          SSH_AUTH_SOCK: /tmp/fake-agent.sock
        run: |
          start=$(date +%s)
          npx --yes @devcontainers/cli@0.89.0 up --workspace-folder . | tee up.json
          echo "devcontainer up took $(( $(date +%s) - start ))s (build + postCreate)"
          echo "CONTAINER_ID=$(tail -n 1 up.json | jq -r .containerId)" >> "$GITHUB_ENV"

      - name: Firewall load time (from the container log)
        run: docker logs "$CONTAINER_ID" 2>&1 | grep 'egress-firewall:'

      - name: Sandbox checks
        run: npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . bash .devcontainer/verify-sandbox.sh

      - name: Model API key reaches the agent at run time
        run: |
          got=$(npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . printenv ANTHROPIC_API_KEY)
          if [ "$got" != "$ANTHROPIC_API_KEY" ]; then echo "key did not reach the container"; exit 1; fi
          echo "key reached the container"

      - name: Model API key is not stored in the image or container
        run: |
          start=$(date +%s)
          SECRET_VALUE="$ANTHROPIC_API_KEY" bash .devcontainer/check-no-baked-secret.sh \
            "$(docker inspect -f '{{.Image}}' "$CONTAINER_ID")" "$CONTAINER_ID"
          echo "check took $(( $(date +%s) - start ))s"

      # Negative control: an image that copies the key in and deletes it in the next layer.
      # The final filesystem is clean, so only the per-layer scan can catch it.
      - name: Baked-in key is caught even after it is deleted
        run: |
          dir=$(mktemp -d)
          printf '%s' "$ANTHROPIC_API_KEY" > "$dir/key.txt"
          base=$(sed -n 's/^FROM //p' .devcontainer/Dockerfile)
          printf 'FROM %s\nCOPY key.txt /tmp/key.txt\nRUN rm /tmp/key.txt\n' "$base" > "$dir/Dockerfile"
          docker build -q -t baked-secret-control "$dir"
          if SECRET_VALUE="$ANTHROPIC_API_KEY" bash .devcontainer/check-no-baked-secret.sh baked-secret-control; then
            echo "check-no-baked-secret.sh missed a key in a deleted layer"; exit 1
          fi
          echo "check-no-baked-secret.sh caught the deleted key, as expected"

      - name: Egress checks
        run: npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . bash .devcontainer/verify-egress.sh

      # Negative control: the same checks in the base image, which has no firewall, must fail.
      # A test that cannot fail proves nothing.
      - name: Egress checks fail without the firewall
        run: |
          base=$(sed -n 's/^FROM //p' .devcontainer/Dockerfile)
          if docker run --rm -v "$PWD/.devcontainer:/c:ro" --user node --entrypoint bash "$base" /c/verify-egress.sh; then
            echo "verify-egress.sh passed in a container with no firewall"; exit 1
          fi
          echo "verify-egress.sh failed without the firewall, as expected"

      - name: Firewall refuses to load on the host's network
        # No NET_ADMIN here, so even if the check failed the rules couldn't reach the runner.
        run: |
          image=$(docker inspect -f '{{.Image}}' "$CONTAINER_ID")
          set +e
          out=$(docker run --rm --network host --user root --entrypoint /usr/local/bin/egress-firewall.sh "$image" 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" = 3
          grep -q "refusing to load" <<<"$out"

      - name: Toolchain works inside the sandbox
        run: npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . npx nx run-many -t lint typecheck test

      - name: Git hooks are enabled inside the sandbox
        run: |
          path=$(npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . git config --get core.hooksPath)
          if [ "$path" != ".githooks" ]; then echo "core.hooksPath is '$path', expected .githooks"; exit 1; fi
          echo "npm ci enabled the hooks (core.hooksPath=$path)"

      # One worktree per agent (Story 2.6): a second agent gets its own checkout and its own
      # sandbox. The sandbox checks must still pass there, and a commit made inside must land
      # on the agent's branch without touching the main checkout.
      - name: Agent worktree gets its own sandbox
        run: |
          git --version
          head_before=$(git rev-parse HEAD)
          scripts/agent-worktree.sh new ci-agent
          wt="$(dirname "$PWD")/$(basename "$PWD").worktrees/ci-agent"
          # Options go between the subcommand and its arguments: after `exec <cmd>` they'd be
          # passed to <cmd>, and the CLI would fall back to the main checkout's container.
          dc() { npx --yes @devcontainers/cli@0.89.0 "$1" --workspace-folder "$wt" --mount-git-worktree-common-dir "${@:2}"; }
          start=$(date +%s)
          dc up > /dev/null
          echo "worktree devcontainer up took $(( $(date +%s) - start ))s"
          dc exec bash .devcontainer/verify-sandbox.sh
          dc exec bash -c 'echo "from the agent" > agent-note.txt && git add agent-note.txt &&
            git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "agent commit" && git log --oneline -1'
          test "$(git log -1 --format=%s agent/ci-agent)" = "agent commit"
          test ! -e agent-note.txt
          test "$(git rev-parse HEAD)" = "$head_before"
          echo "commit landed on agent/ci-agent; main checkout untouched"
