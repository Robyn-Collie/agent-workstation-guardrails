# Builds the real devcontainer on a GitHub-hosted runner and proves the sandbox checks
# pass inside it, with fake host credentials planted outside to show they don't leak in.
name: devcontainer

on:
  pull_request:
    paths: ['.devcontainer/**', '.github/workflows/devcontainer.yml']
  push:
    branches: [main]
    paths: ['.devcontainer/**', '.github/workflows/devcontainer.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Plant fake host credentials the container must not see
        run: |
          mkdir -p ~/.ssh ~/.aws
          echo "FAKE-not-a-key" > ~/.aws/credentials
          echo "FAKE-not-a-key" > ~/.ssh/id_fake

      - name: Build and start the devcontainer
        env:
          AWS_ACCESS_KEY_ID: FAKE-not-a-key
          SSH_AUTH_SOCK: /tmp/fake-agent.sock
        run: |
          start=$(date +%s)
          npx --yes @devcontainers/cli@0.89.0 up --workspace-folder . | tee up.json
          echo "devcontainer up took $(( $(date +%s) - start ))s (build + postCreate)"
          echo "CONTAINER_ID=$(tail -n 1 up.json | jq -r .containerId)" >> "$GITHUB_ENV"

      - name: Firewall load time (from the container log)
        run: docker logs "$CONTAINER_ID" 2>&1 | grep 'egress-firewall:'

      - name: Sandbox checks
        run: npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . bash .devcontainer/verify-sandbox.sh

      - name: Egress checks
        run: npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . bash .devcontainer/verify-egress.sh

      # Negative control: the same checks in the base image, which has no firewall, must fail.
      # A test that cannot fail proves nothing.
      - name: Egress checks fail without the firewall
        run: |
          base=$(sed -n 's/^FROM //p' .devcontainer/Dockerfile)
          if docker run --rm -v "$PWD/.devcontainer:/c:ro" --user node --entrypoint bash "$base" /c/verify-egress.sh; then
            echo "verify-egress.sh passed in a container with no firewall"; exit 1
          fi
          echo "verify-egress.sh failed without the firewall, as expected"

      - name: Toolchain works inside the sandbox
        run: npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . npx nx run-many -t lint typecheck test
