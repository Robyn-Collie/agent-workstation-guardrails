[project]
name = "secret-scan"
version = "0.1.0"
description = "Zero-dependency secret scanner for pre-commit and pre-push hooks."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
secret-scan = "secret_scan.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["repo_scan: scans the whole repository; run by the uncached scan-repo target"]
